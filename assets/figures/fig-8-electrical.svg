<text x="450" y="470" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="400" fill="#111">Power and data cross the separable dock (28) only. The inner suit carries the battery (60) and controller (58). The shell carries the display (22) and its drivers (66).</text>

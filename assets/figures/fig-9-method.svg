<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="t">
  <title id="t">FIG. 9 method flowchart</title>
  <rect width="900" height="560" fill="#fff"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111"/></marker></defs>
<text x="450" y="32" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="400" fill="#111">Method of using the two-piece garment</text>
<path d="M180 70 L720 70 L720 114 L180 114 Z" fill="#fff" stroke="#111" stroke-width="1.45" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="210" cy="92" r="14" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="210" y="97" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" font-weight="700" fill="#111">A</text>
<text x="240" y="98" text-anchor="start" font-family="Times New Roman, Times, serif" font-size="14" font-weight="400" fill="#111">Don the inner suit (12)</text>
<line x1="450" y1="114" x2="450" y2="132" stroke="#111" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M180 132 L720 132 L720 176 L180 176 Z" fill="#fff" stroke="#111" stroke-width="1.45" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="210" cy="154" r="14" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="210" y="159" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" font-weight="700" fill="#111">B</text>
<text x="240" y="160" text-anchor="start" font-family="Times New Roman, Times, serif" font-size="14" font-weight="400" fill="#111">Don the outer shell (14) over the inner suit</text>
<line x1="450" y1="176" x2="450" y2="194" stroke="#111" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M180 194 L720 194 L720 238 L180 238 Z" fill="#fff" stroke="#111" stroke-width="1.45" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="210" cy="216" r="14" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="210" y="221" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" font-weight="700" fill="#111">C</text>
<text x="240" y="222" text-anchor="start" font-family="Times New Roman, Times, serif" font-size="14" font-weight="400" fill="#111">Align the docks (28, 94) with feature (52)</text>
<line x1="450" y1="238" x2="450" y2="256" stroke="#111" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M180 256 L720 256 L720 300 L180 300 Z" fill="#fff" stroke="#111" stroke-width="1.45" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="210" cy="278" r="14" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="210" y="283" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" font-weight="700" fill="#111">D</text>
<text x="240" y="284" text-anchor="start" font-family="Times New Roman, Times, serif" font-size="14" font-weight="400" fill="#111">Couple magnets (32); engage pogo pins (30)</text>
<line x1="450" y1="300" x2="450" y2="318" stroke="#111" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M180 318 L720 318 L720 362 L180 362 Z" fill="#fff" stroke="#111" stroke-width="1.45" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="210" cy="340" r="14" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="210" y="345" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" font-weight="700" fill="#111">E</text>
<text x="240" y="346" text-anchor="start" font-family="Times New Roman, Times, serif" font-size="14" font-weight="400" fill="#111">Play mapped content (86) on the display (22)</text>
<line x1="450" y1="362" x2="450" y2="380" stroke="#111" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M180 380 L720 380 L720 424 L180 424 Z" fill="#fff" stroke="#111" stroke-width="1.45" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="210" cy="402" r="14" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="210" y="407" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" font-weight="700" fill="#111">F</text>
<text x="240" y="408" text-anchor="start" font-family="Times New Roman, Times, serif" font-size="14" font-weight="400" fill="#111">Detach the shell (14) from the inner suit (12)</text>
<line x1="450" y1="424" x2="450" y2="442" stroke="#111" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M180 442 L720 442 L720 486 L180 486 Z" fill="#fff" stroke="#111" stroke-width="1.45" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="210" cy="464" r="14" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="210" y="469" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" font-weight="700" fill="#111">G</text>
<text x="240" y="470" text-anchor="start" font-family="Times New Roman, Times, serif" font-size="14" font-weight="400" fill="#111">Launder the inner suit (12); wipe the shell (14)</text>
  <text x="450.0" y="542" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="18" font-weight="700" fill="#111">FIG. 9</text>
